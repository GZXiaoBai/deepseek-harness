name: Windows Desktop

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  windows-desktop:
    name: Windows Tauri / NSIS x64
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_WINDOWS == 'selfhosted'
          && github.event_name == 'pull_request'
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && fromJSON('["self-hosted", "dsh-win-ci", "windows"]')
          || 'windows-2025' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install Rust MSVC target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Test Tauri Desktop behavior
        shell: pwsh
        run: pnpm run test:desktop

      - name: Build Windows x64 Tauri App and NSIS
        shell: pwsh
        run: pnpm run package:desktop:tauri

      - name: Report packaged sidecar feasibility
        shell: pwsh
        run: node apps/desktop/scripts/verify-sidecar-feasibility.mjs

      - name: Install WebView2 Runtime for Server acceptance
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList '/silent /install' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "WebView2 bootstrapper exited with $($process.ExitCode)" }

      - name: Verify unpacked App, installation, launch, and uninstall
        shell: pwsh
        env:
          DSH_POWERSHELL_EXECUTABLE: pwsh.exe
        run: pnpm --filter @deepseek-ai/dsh-desktop run verify:tauri:windows

      - name: Report package size and performance
        shell: pwsh
        run: Get-Content apps/desktop/release-tauri/verify-stats.json

      - name: Upload unsigned personal installer and statistics
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-tauri-windows-x64
          path: |
            apps/desktop/release-tauri/DeepSeek Harness Setup *-x64.exe
            apps/desktop/release-tauri/verify-stats.json
          if-no-files-found: error
          retention-days: 14
