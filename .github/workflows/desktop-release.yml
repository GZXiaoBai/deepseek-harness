name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  windows:
    name: Desktop Release / Windows NSIS x64
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      PRIMARY_NODE_VERSION: '24'
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Restore Electron binary cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/dsh-electron
          key: windows-electron-${{ hashFiles('apps/desktop/package.json') }}-win32-x64

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Provision verified Electron binary
        shell: pwsh
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: '& apps/desktop/scripts/provision-windows-electron.ps1'

      - name: Package Windows x64 App and NSIS
        shell: pwsh
        run: pnpm run package:desktop

      - name: Verify the packaged application
        shell: pwsh
        env:
          DSH_POWERSHELL_EXECUTABLE: pwsh.exe
        run: pnpm --filter @deepseek-ai/dsh-desktop run verify:package

      - name: Publish installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "apps/desktop/release/DeepSeek Harness Setup *-x64.exe" | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "apps/desktop/release/$($installer.Name).sha256"
          gh release create "$env:GITHUB_REF_NAME" "$($installer.FullName)" "apps/desktop/release/$($installer.Name).sha256" --title "$env:GITHUB_REF_NAME" --generate-notes 2>$null
          gh release upload "$env:GITHUB_REF_NAME" "$($installer.FullName)" "apps/desktop/release/$($installer.Name).sha256" --clobber

  macos:
    name: Desktop Release / macOS arm64 DMG
    runs-on: macos-15
    timeout-minutes: 120
    env:
      PRIMARY_NODE_VERSION: '24'
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package macOS arm64 App and DMG
        run: pnpm run package:desktop

      - name: Verify the packaged application
        run: pnpm --filter @deepseek-ai/dsh-desktop run verify:package

      - name: Publish DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(ls apps/desktop/release/*-arm64.dmg | head -1)
          shasum -a 256 "$DMG" | sed 's#apps/desktop/release/##' > "$DMG.sha256"
          gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" --clobber
