name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  DSH_UPDATE_PUBLIC_KEY: 'dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEEyQzAwMzNFOTZGN0ZGMDQKUldRRS8vZVdQZ1BBb25lb0txMDVjT3psb3NlVnZlZEdsR1A3dk1rT25nR0ZjdmlPMXlrN1hENWMK'

jobs:
  windows:
    name: Desktop Release / Windows NSIS x64
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install Rust MSVC target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Require updater signing secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'TAURI_SIGNING_PRIVATE_KEY is required' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required' }

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Package Tauri Windows x64 App and NSIS
        shell: pwsh
        run: pnpm run package:desktop:tauri

      - name: Install WebView2 Runtime for Server acceptance
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList '/silent /install' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "WebView2 bootstrapper exited with $($process.ExitCode)" }

      - name: Verify unpacked App, installation, launch, and uninstall
        shell: pwsh
        env:
          DSH_POWERSHELL_EXECUTABLE: pwsh.exe
        run: pnpm --filter @deepseek-ai/dsh-desktop run verify:tauri:windows

      - name: Verify updater signature and tamper rejection
        shell: pwsh
        run: |
          $artifact = Get-ChildItem 'apps/desktop/release-tauri/DeepSeek Harness Setup *-x64.exe' | Select-Object -First 1
          $env:DSH_UPDATE_ARTIFACT = $artifact.FullName
          $env:DSH_UPDATE_SIGNATURE = "$($artifact.FullName).sig"
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test packaged_update_signature -- --nocapture

      - name: Upload signed Windows release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: deepseek-harness-tauri-windows-x64
          path: |
            apps/desktop/release-tauri/DeepSeek Harness Setup *-x64.exe
            apps/desktop/release-tauri/DeepSeek Harness Setup *-x64.exe.sig
            apps/desktop/release-tauri/verify-stats.json
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Desktop Release / macOS arm64 DMG
    runs-on: macos-15
    timeout-minutes: 120
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install Rust Apple Silicon target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Require updater signing secrets
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'TAURI_SIGNING_PRIVATE_KEY is required' >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required' >&2; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Tauri macOS arm64 App and DMG
        run: pnpm run package:desktop:tauri

      - name: Verify App, DMG, signature, launch, and shutdown
        run: pnpm --filter @deepseek-ai/dsh-desktop run verify:tauri:macos

      - name: Verify updater signature and tamper rejection
        run: |
          ARTIFACT=$(realpath "$(find apps/desktop/release-tauri -maxdepth 1 -name '*.app.tar.gz' -print -quit)")
          DSH_UPDATE_ARTIFACT="$ARTIFACT" \
          DSH_UPDATE_SIGNATURE="$ARTIFACT.sig" \
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test packaged_update_signature -- --nocapture

      - name: Upload signed macOS release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: deepseek-harness-tauri-macos-arm64
          path: |
            apps/desktop/release-tauri/*-arm64.dmg
            apps/desktop/release-tauri/*.app.tar.gz
            apps/desktop/release-tauri/*.app.tar.gz.sig
            apps/desktop/release-tauri/verify-stats.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Desktop Release / Publish
    runs-on: ubuntu-24.04
    needs: [windows, macos]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: deepseek-harness-tauri-windows-x64
          path: collected/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v7
        with:
          name: deepseek-harness-tauri-macos-arm64
          path: collected/macos

      - name: Create updater manifest and SHA-256 files
        run: |
          mkdir release-assets
          find collected/windows collected/macos -maxdepth 1 -type f ! -name 'verify-stats.json' -exec cp '{}' release-assets/ ';'
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          node apps/desktop/scripts/create-tauri-update-manifest.mjs --release-directory release-assets --tag "$GITHUB_REF_NAME" --version "$VERSION"
          find release-assets -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.app.tar.gz' \) -print0 | while IFS= read -r -d '' artifact; do
            (cd release-assets && sha256sum "$(basename "$artifact")") > "$artifact.sha256"
          done

      - name: Publish installers and signed updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --title "$GITHUB_REF_NAME" --generate-notes
